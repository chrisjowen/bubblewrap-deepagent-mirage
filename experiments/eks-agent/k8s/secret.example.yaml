# Copy to secret.yaml, fill in values, then:
#   kubectl -n ada apply -f eks/k8s/secret.yaml
#
# Or one-liner from local .env:
#   kubectl -n ada create secret generic ada-env --from-env-file=.env
#
# secret.yaml is gitignored — see eks/.gitignore.

apiVersion: v1
kind: Secret
metadata:
  name: ada-env
  namespace: ada
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "sk-ant-..."
  S3_BUCKET: "mirage-test-chris"
  S3_REGION: "ap-southeast-1"
  S3_KEY_PREFIX: "chris"
  # Only needed if not using IRSA for S3:
  AWS_ACCESS_KEY_ID: "AKIA..."
  AWS_SECRET_ACCESS_KEY: "..."
  AWS_DEFAULT_REGION: "ap-southeast-1"
